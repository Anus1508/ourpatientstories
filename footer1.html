<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="footer1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>Footer</title>
    
</head>
<body>
    <footer class="footercontainer">
        <div class="footercontainer__leftpart">
            
            <button class="footercontainer__button">Contact Us <img src="Images/right-arrow.png" alt="rightarrow"></button>
            <address class="footer__address">
                <span class="footer__org">Let Them Shine</span>
                <span class="footer__divider">||</span>
                <span class="footer__street"> 60 Minuteman Road </span>
                <span class="footer__divider">||</span>
                <span class="footer__city"> Andover MA</span>
                <span class="footer__divider">||</span>
                <span class="footer__zip">01810</span>
            </address>
            <div class="footer__socialmediaicons">
                <ul class="footer__mediaicons">
                    <li class="footer__mediaiconitems"><img src="Images/facebookicon.png" alt="facebookicon"></li>
                    <li class="footer__mediaiconitems"><img src="Images/twittericon.png" alt="twittericon"></li>
                    <li class="footer__mediaiconitems"><img src="Images/youtubeicon.png" alt="youtubeicon"></li>
                    <li class="footer__mediaiconitems"><img src="Images/instagramicon.png" alt="instagramicon"></li>
                    <li class="footer__mediaiconitems"><img src="Images/linkedinicon.png" alt="linkedinicon"></li>
                </ul>
            </div>
            <div class="footer__copyright">
                <small>Copyright © 2022 Institut Straumann AG</small>
            </div>
        </div>
        <div class="footercontainer__rightpart">
            
               <img src="Images/logo.png" alt="footerlogo">
            

        </div>

    </footer>
    
</body>
</html>
